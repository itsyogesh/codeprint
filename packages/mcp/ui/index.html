<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codeprint PDF preview</title>
<style>
:root{font-family:Mulish,system-ui,sans-serif;color:#0f172a;background:#f8fafc;color-scheme:light}
:root[data-theme=dark]{color:#f8fafc;background:#0f172a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font:700 20px Merriweather,Georgia,serif;margin:0}p{font-size:13px;color:#64748b;margin:6px 0 0}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{border:1px solid #cbd5e1;border-radius:999px;padding:9px 14px;background:transparent;color:inherit;cursor:pointer;font:600 13px Mulish,system-ui,sans-serif;box-shadow:0 2px 0 #cbd5e1}
button:active{transform:translateY(2px);box-shadow:none}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid #f97316;outline-offset:3px}#download{background:#f97316;color:#fff;border-color:#ea580c;box-shadow:0 2px 0 #c2410c}
#page-label{font-size:13px;font-variant-numeric:tabular-nums;min-width:84px;text-align:center}#paper{width:100%;margin:0 auto;max-width:1100px}canvas{display:block;max-width:100%;background:#fff;box-shadow:0 6px 20px #0002}canvas[hidden],[hidden]{display:none!important}#status{padding:24px;text-align:center;font-size:14px;line-height:1.5;border:1px solid #cbd5e1;border-radius:12px}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style></head><body>
<header><div><h1>Codeprint preview</h1><p>The exact saved PDF. Previewing does not print.</p></div>
<nav class="controls" aria-label="PDF pages"><button type="button" id="previous" disabled aria-label="Previous page">←</button><span id="page-label" role="status" aria-live="polite">No PDF yet</span><button type="button" id="next" disabled aria-label="Next page">→</button><button type="button" id="download" disabled hidden>Save PDF</button></nav></header>
<p id="status" role="status">Create a PDF with Codeprint to see it here.</p><main id="paper"><canvas hidden aria-label="Rendered PDF page" role="img"></canvas></main>
<script type="module">/* CODEPRINT_APP_SCRIPT */</script></body></html>
